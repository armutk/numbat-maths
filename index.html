<body>
  <div id="app"></div>
  <script type="module">
    import { boot } from './js/app.js';
    boot();
    if ('serviceWorker' in navigator) {
      addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./sw.js');
          // pick up a new build on the next open: when a fresh worker is waiting, let it take over
          reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) w.postMessage('skipWaiting'); }); });
          // reload only when an UPDATED worker takes over (not on the very first install, which would interrupt the greeting)
          const hadController = !!navigator.serviceWorker.controller;
          let reloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded && !document.querySelector('.pip-screen')) { reloaded = true; location.reload(); } });
          setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
        } catch {}
      });
    }
  </script>
</body>
